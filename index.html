:root {

* { box-sizing:border-box; }

aside {

.phase-btn.active, .lead-btn.active {

}
.lead-btn small {

input, textarea, select {

  color:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
}
textarea {

}
label {

  font-size:13px;
  color:#bfdbfe;
  margin-bottom:6px;
  font-weight:bold;
}
.grid2 {

  grid-template-columns:repeat(2,minmax(0,1fr));

.grid3 {

  grid-template-columns:repeat(3,minmax(0,1fr));

}

.path-grid {

  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

.path {

  padding:14px;
}
.good { border-color:#16a34a; }
.warn { border-color:#f59e0b; }
.bad { border-color:#ef4444; }
button {
  border:none;

  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}
.main-btn { background:var(--accent); color:#02111f; }
.secondary-btn {

  border:1px solid var(--border);

}
.danger-btn {

.flex { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.status-line {

hr {

let currentPhase = 0;
let leads = [];
let currentLead = null;

function safe(v) {
  return String(v || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function formatDate(v) {
  if (!v) return "";
  try {
    return new Date(v).toLocaleString();
  } catch(e) {
    return v;
  }
}

async function loadLeads() {
  const { data, error } = await supabaseClient
    .from("leads")
    .select("*")
    .order("created_at", { ascending:false });

  if (error) {
    console.error(error);
    document.getElementById("sideStatus").innerText = "Fehler beim Laden.";
    return;
  }

  leads = data || [];
  document.getElementById("sideStatus").innerText = leads.length + " Leads geladen.";
  renderLeadList();

  const remembered = localStorage.getItem("lr_crm_current_lead");
  if (remembered && !currentLead) {
    const found = leads.find(l => l.id === remembered);
    if (found) selectLead(found.id);
  } else if (!currentLead && leads.length) {
    selectLead(leads[0].id);
  } else {
    renderMain();
  }
}

function renderLeadList() {
  const q = (document.getElementById("leadSearch")?.value || "").toLowerCase();
  const list = document.getElementById("leadList");

  const filtered = leads.filter(l => {
    const hay = `${l.name || ""} ${l.setter || ""} ${l.status || ""} ${l.phone || ""}`.toLowerCase();
    return hay.includes(q);
  });

  list.innerHTML = filtered.map(l => `
    <button class="lead-btn ${currentLead?.id === l.id ? "active" : ""}" onclick="selectLead('${l.id}')">
      ${safe(l.name || "Ohne Name")}
      <small>${safe(l.status || "Setter")} · ${safe(l.setter || "kein Setter")}</small>
    </button>
  `).join("") || `<p class="muted">Keine Leads gefunden.</p>`;
}

function renderPhaseNav() {
  document.getElementById("phaseNav").innerHTML = phases.map((p,i)=>`
    <button class="phase-btn ${i===currentPhase ? "active" : ""}" onclick="goPhase(${i})">
      ${safe(p.title)}
    </button>
  `).join("");
}

async function selectLead(id) {
  const found = leads.find(l => l.id === id);
  if (!found) return;
  currentLead = found;
  localStorage.setItem("lr_crm_current_lead", id);
  renderLeadList();
  renderPhaseNav();
  await renderMain();
}

function newLead() {
  currentLead = null;
  currentPhase = 0;
  localStorage.removeItem("lr_crm_current_lead");
  renderLeadList();
  renderPhaseNav();
  renderMain();
}

async function createOrUpdateLead() {
  const name = document.getElementById("leadName").value.trim();
  const setter = document.getElementById("setterName").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const status = document.getElementById("status").value;
  const appointment_at_raw = document.getElementById("appointmentAt").value;
  const appointment_at = appointment_at_raw ? new Date(appointment_at_raw).toISOString() : null;

  if (!name) {
    alert("Lead Name fehlt.");
    return;
  }

  if (!currentLead) {
    const { data, error } = await supabaseClient
      .from("leads")
      .insert([{
        name, setter, phone, status, appointment_at,
        updated_at:new Date().toISOString()
      }])
      .select()
      .single();

    if (error) {
      console.error(error);
      alert("Fehler beim Erstellen.");
      return;
    }

    currentLead = data;
    localStorage.setItem("lr_crm_current_lead", data.id);
  } else {
    const { data, error } = await supabaseClient
      .from("leads")
      .update({
        name, setter, phone, status, appointment_at,
        updated_at:new Date().toISOString()
      })
      .eq("id", currentLead.id)
      .select()
      .single();

    if (error) {
      console.error(error);
      alert("Fehler beim Aktualisieren.");
      return;
    }

    currentLead = data;
  }

  await loadLeads();
  document.getElementById("saveStatus").innerText = "Lead gespeichert.";
}

async function getCurrentNote() {
  if (!currentLead) return "";
  const { data, error } = await supabaseClient
    .from("lead_notes")
    .select("note")
    .eq("lead_id", currentLead.id)
    .eq("phase_number", currentPhase)
    .maybeSingle();

  if (error) {
    console.error(error);
    return "";
  }

  return data?.note || "";
}

async function saveCurrentNote() {
  if (!currentLead) {
    alert("Bitte zuerst Lead speichern.");
    return false;
  }

  const note = document.getElementById("phaseNote").value;
  const p = phases[currentPhase];

  const { error } = await supabaseClient
    .from("lead_notes")
    .upsert([{
      lead_id:currentLead.id,
      phase_number:currentPhase,
      phase_title:p.title,
      note,
      updated_at:new Date().toISOString()
    }], {
      onConflict:"lead_id,phase_number"
    });

  if (error) {
    console.error(error);
    alert("Fehler beim Speichern der Notiz.");
    return false;
  }

  document.getElementById("saveStatus").innerText = "Notiz gespeichert: " + new Date().toLocaleTimeString();
  return true;
}

async function saveAndNext() {
  const ok = await saveCurrentNote();
  if (ok && currentPhase < phases.length - 1) {
    currentPhase++;
    renderPhaseNav();
    await renderMain();
  }
}

async function copyNotes() {
  if (!currentLead) {
    alert("Noch kein Lead ausgewählt.");
    return;
  }

  await saveCurrentNote();

  const { data, error } = await supabaseClient
    .from("lead_notes")
    .select("*")
    .eq("lead_id", currentLead.id)
    .order("phase_number");

  if (error) {
    console.error(error);
    alert("Notizen konnten nicht geladen werden.");
    return;
  }

  let text = "CLOSER-ÜBERGABE\n";
  text += "Lead: " + (currentLead.name || "") + "\n";
  text += "Telefon: " + (currentLead.phone || "") + "\n";
  text += "Setter: " + (currentLead.setter || "") + "\n";
  text += "Status: " + (currentLead.status || "") + "\n";
  text += "Termin: " + formatDate(currentLead.appointment_at) + "\n";
  text += "Erstellt: " + formatDate(currentLead.created_at) + "\n\n";

  if (!data || data.length === 0) {
    text += "Keine Notizen gespeichert.";
  } else {
    data.forEach(item => {
      if (item.note && item.note.trim()) {
        text += item.phase_title + "\n";
        text += item.note.trim() + "\n\n";
      }
    });
  }

  await navigator.clipboard.writeText(text);
  alert("Closer-Übergabe kopiert.");
}

async function deleteCurrentLead() {
  if (!currentLead) return;
  const ok = confirm("Diesen Lead wirklich löschen? Alle Notizen dazu werden ebenfalls gelöscht.");
  if (!ok) return;

  const { error } = await supabaseClient
    .from("leads")
    .delete()
    .eq("id", currentLead.id);

  if (error) {
    console.error(error);
    alert("Löschen fehlgeschlagen.");
    return;
  }

  currentLead = null;
  localStorage.removeItem("lr_crm_current_lead");
  await loadLeads();
}

async function goPhase(i) {
  currentPhase = i;
  renderPhaseNav();
  await renderMain();
}

async function renderMain() {
  const p = phases[currentPhase];
  const note = await getCurrentNote();

  const lead = currentLead || {
    name:"",
    setter:"",
    phone:"",
    status:"Setter",
    appointment_at:null,
    created_at:null
  };

  const appointmentLocal = lead.appointment_at
    ? new Date(lead.appointment_at).toISOString().slice(0,16)
    : "";

  document.getElementById("main").innerHTML = `
    <div class="card">
      <h2>${currentLead ? "Lead bearbeiten" : "Neuen Lead anlegen"}</h2>
      <div class="grid2">
        <div>
          <label>Lead Name</label>
          <input id="leadName" value="${safe(lead.name)}" placeholder="z.B. Sarah / Kevin">
        </div>
        <div>
          <label>Telefon</label>
          <input id="phone" value="${safe(lead.phone)}" placeholder="+49...">
        </div>
      </div>

      <br>

      <div class="grid3">
        <div>
          <label>Setter</label>
          <input id="setterName" value="${safe(lead.setter)}" placeholder="Setter Name">
        </div>
        <div>
          <label>Status</label>
          <select id="status">
            ${["Setter","Termin gebucht","Closing","Sold","Lost","Follow-up"].map(s => `
              <option value="${s}" ${(lead.status || "Setter") === s ? "selected" : ""}>${s}</option>
            `).join("")}
          </select>
        </div>
        <div>
          <label>Termin</label>
          <input id="appointmentAt" type="datetime-local" value="${appointmentLocal}">
        </div>
      </div>

      <br>

      <div class="flex">
        <button class="main-btn" onclick="createOrUpdateLead()">Lead speichern</button>
        <button class="secondary-btn" onclick="copyNotes()">Closer-Übergabe kopieren</button>
        <button class="secondary-btn" onclick="showLeadOverview()">Lead-Übersicht</button>
        ${currentLead ? '<button class="danger-btn" onclick="deleteCurrentLead()">Lead löschen</button>' : ''}
      </div>

      <div id="saveStatus" class="status-line">
        ${currentLead ? "Aktueller Lead: " + safe(currentLead.name) : "Noch nicht gespeichert."}
      </div>
    </div>

    <div class="card">
      <h2>${safe(p.title)}</h2>
      <p>${safe(p.goal)}</p>
    </div>

    <div class="card">
      <h3>Vorlesbarer Skriptblock</h3>
      <div class="script">${safe(p.script)}</div>
    </div>

    <div class="card">
      <h3>Klick-Pfade</h3>
      <div class="path-grid">
        ${p.paths.map(path=>`
          <div class="path ${safe(path.type)}">
            <h4>${safe(path.label)}</h4>
            <div class="script">${safe(path.text)}</div>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="card">
      <h3>Notizen für diese Phase</h3>
      <textarea id="phaseNote" placeholder="Hier Notizen eintragen...">${safe(note)}</textarea>
      <div class="flex" style="margin-top:14px;">
        <button class="secondary-btn" onclick="goPhase(Math.max(0,currentPhase-1))">← Zurück</button>
        <button class="main-btn" onclick="saveCurrentNote()">Notiz speichern</button>
        <button class="main-btn" onclick="saveAndNext()">Speichern & weiter →</button>
      </div>
    </div>
  `;
}


async function showLeadOverview() {
  if (!currentLead) {
    alert("Kein Lead ausgewählt.");
    return;
  }

  const { data, error } = await supabaseClient
    .from("lead_notes")
    .select("*")
    .eq("lead_id", currentLead.id)
    .order("phase_number");

  if (error) {
    console.error(error);
    alert("Übersicht konnte nicht geladen werden.");
    return;
  }

  const notesHtml = data.map(item => `
    <div class="card">
      <h3>${safe(item.phase_title)}</h3>
      <div class="script">${safe(item.note || "Keine Notiz.")}</div>
    </div>
  `).join("");

  const popup = document.createElement("div");
  popup.id = "overviewPopup";
  popup.style.position = "fixed";
  popup.style.inset = "0";
  popup.style.background = "rgba(0,0,0,.82)";
  popup.style.zIndex = "9999";
  popup.style.overflowY = "auto";
  popup.style.padding = "40px";

  popup.innerHTML = `
    <div style="max-width:1100px;margin:auto;">
      <div class="card">
        <div class="flex" style="justify-content:space-between;">
          <div>
            <h2>${safe(currentLead.name || "Lead")}</h2>
            <div class="muted">
              ${safe(currentLead.status || "")} ·
              ${safe(currentLead.setter || "")}
            </div>
          </div>

          <button class="danger-btn" onclick="document.getElementById('overviewPopup').remove()">
            Schließen
          </button>
        </div>
      </div>

      ${notesHtml || '<div class="card">Keine Notizen vorhanden.</div>'}
    </div>
  `;

  document.body.appendChild(popup);
}


renderPhaseNav();
loadLeads();
</script>
</body>
</html>
