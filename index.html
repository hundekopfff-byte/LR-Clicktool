<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Love Repair Click Tool CRM</title>

<style>
:root {
  --bg:#0f172a;
  --panel:#111827;
  --panel2:#1f2937;
  --text:#f9fafb;
  --muted:#94a3b8;
  --accent:#60a5fa;
  --border:#334155;
  --green:#22c55e;
  --yellow:#f59e0b;
  --red:#ef4444;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:var(--text);
}
header {
  padding:20px 24px;
  border-bottom:1px solid var(--border);
  background:rgba(15,23,42,.96);
}
header h1 { margin:0 0 6px; font-size:28px; }
header p { margin:0; color:var(--muted); }
.layout {
  display:grid;
  grid-template-columns:280px minmax(0, 1fr) 430px;
  min-height:calc(100vh - 83px);
}
aside {
  border-right:1px solid var(--border);
  background:#07101f;
  padding:14px;
  overflow-y:auto;
}
main {
  padding:24px;
  padding-bottom:260px;
  min-width:0;
  overflow-x:hidden;
}
.card {
  background:rgba(17,24,39,.95);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
}
.sidebar-title {
  font-size:14px;
  color:#bfdbfe;
  margin:6px 0 10px;
  font-weight:bold;
}
.phase-btn, .lead-btn {
  width:100%;
  margin-bottom:8px;
  padding:11px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#111827;
  color:white;
  cursor:pointer;
  text-align:left;
  font-weight:bold;
}
.phase-btn.active, .lead-btn.active {
  border-color:var(--accent);
  background:#172554;
}
.lead-btn small {
  display:block;
  color:var(--muted);
  font-weight:normal;
  margin-top:4px;
}
input, textarea, select {
  width:100%;
  background:#020617;
  color:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
}
textarea {
  min-height:150px;
  resize:vertical;
}
label {
  display:block;
  font-size:13px;
  color:#bfdbfe;
  margin-bottom:6px;
  font-weight:bold;
}
.grid2 {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.grid3 {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.script {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:#020617;
  border-left:4px solid var(--accent);
  padding:16px;
  border-radius:12px;
  line-height:1.55;
}
.path-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}
.path {
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
}
.good { border-color:#16a34a; }
.warn { border-color:#f59e0b; }
.bad { border-color:#ef4444; }
button {
  border:none;
  padding:11px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}
.main-btn { background:var(--accent); color:#02111f; }
.secondary-btn {
  background:#111827;
  border:1px solid var(--border);
  color:white;
}
.danger-btn {
  background:#3f1111;
  border:1px solid #7f1d1d;
  color:white;
}
.flex { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.status-line {
  color:#93c5fd;
  font-size:13px;
  margin-top:10px;
}
.autosave-hint {
  color:#94a3b8;
  font-size:12px;
  margin-top:8px;
}
.sticky-note-card {
  position: fixed;
  left: 300px;
  right: 430px;
  bottom: 0;
  z-index: 999;
  margin: 0;
  border-radius: 18px 18px 0 0;
  border-bottom: 0;
  box-shadow: 0 -16px 40px rgba(0,0,0,.45);
}
.sticky-note-card textarea {
  min-height: 95px;
  max-height: 150px;
}
@media(max-width:1100px) {
  .sticky-note-card {
    position: sticky;
    left: auto;
    right: auto;
    bottom: 0;
    border-radius:18px;
  }
}
hr {
  border:0;
  border-top:1px solid var(--border);
  margin:16px 0;
}
.search {
  margin-bottom:10px;
}
.muted { color:var(--muted); }
.setter-switch {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.setter-btn {
  flex:1;
  min-width:80px;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#111827;
  color:white;
  cursor:pointer;
  font-weight:bold;
}
.setter-btn.active {
  background:#172554;
  border-color:var(--accent);
  color:#bfdbfe;
}

.objection-panel {
  border-left:1px solid var(--border);
  background:#07101f;
  padding:14px;
  overflow-y:auto;
  position:sticky;
  top:0;
  height:calc(100vh - 83px);
}
.objection-title {
  font-size:15px;
  color:#bfdbfe;
  font-weight:bold;
  margin-bottom:10px;
}
.objection-card {
  background:#111827;
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  cursor:pointer;
}
.objection-card:hover {
  border-color:var(--accent);
}
.objection-card h4 {
  margin:0;
  font-size:14px;
}
.objection-content {
  display:none;
  margin-top:12px;
}
.objection-card.open .objection-content {
  display:block;
}
.objection-section {
  margin-top:10px;
}
.objection-section strong {
  color:#bfdbfe;
}
.objection-mini {
  white-space:pre-wrap;
  background:#020617;
  border-left:3px solid var(--accent);
  padding:10px;
  border-radius:10px;
  line-height:1.45;
  margin-top:6px;
  font-size:13px;
}
.empty-objections {
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}
.global-tools {
  margin-top:32px;
  border-top:2px solid rgba(147,197,253,.18);
  padding-top:24px;
}
.global-tool-card {
  background:#111827;
  border:1px solid #475569;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  cursor:pointer;
}
.global-tool-card:hover {
  border-color:#93c5fd;
}
.global-tool-card h4 {
  margin:0;
  font-size:14px;
}
.global-tool-content {
  display:none;
  margin-top:12px;
}
.global-tool-card.open .global-tool-content {
  display:block;
}

@media(max-width:1100px) {
  .layout { grid-template-columns:1fr; }
  .objection-panel { position:relative; height:auto; border-left:0; border-top:1px solid var(--border); }
}

@media(max-width:950px) {
  .layout { grid-template-columns:1fr; }
  .grid2, .grid3 { grid-template-columns:1fr; }
}

.action-icon {
  width:18px;
  height:18px;
  object-fit:contain;
  display:inline-block;
  vertical-align:middle;
  border-radius:4px;
  margin-right:6px;
}
.action-icon.phone-icon {
  border-radius:6px;
}


.lr-brand-wrap {
  position: fixed;
  right: 34px;
  bottom: 28px;
  z-index: 38;
  width: 220px;
  height: 210px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

.lr-brand-text {
  position: relative;

  color: #fff7ed;

  letter-spacing: 12px;
  font-size: 16px;

  text-transform: uppercase;
  text-shadow:

    0 0 28px rgba(239,68,68,.22),

@media(max-width:1200px) {
  .lr-brand-wrap {
    width: 160px;
    height: 150px;
    right: 18px;
    bottom: 18px;
    opacity: .78;
  }

    width: 150px;
    height: 135px;
  }
  .lr-brand-mark {
    width: 78px;
  }
  .lr-brand-text {
    font-size: 11px;
    letter-spacing: 7px;
    margin-top: 10px;
  }
}

</style>
</head>

1. Geld vs. Beziehung

„Stell dir vor, du hättest morgen die Wahl: Du bekommst 50.000 Euro steuerfrei auf dein Konto — oder du kommst wieder mit ihr/ihm zusammen.“

„Was würdest du wählen?“

„Okay. Und wenn es 100.000 Euro wären?“

Wenn wieder Beziehung:

Wenn Geld:

2. Der Garantie-Zauberer

„Mal angenommen, ich wäre ein Zauberer. Ich schnipse mit dem Finger und du bist in zwei, drei Wochen wieder mit ihr/ihm zusammen. Nicht irgendwie wackelig, sondern wirklich stabil. Ihr seid glücklich, es hält, es fühlt sich richtig an.“

„Das Ganze kostet aber 15.000 Euro. Und du hättest eine hundertprozentige Garantie. Du wüsstest sicher: Es funktioniert.“

„Würdest du es machen?“

„Und ich frage dich das wirklich ernsthaft — nicht einfach so dahergesagt. Wenn du das Geld hättest und du wüsstest wirklich zu 100 Prozent, dass es klappt: Würdest du es einsetzen?“

Wenn Ja:
„Gut. Dann sehen wir gerade etwas Wichtiges: Wenn du absolute Sicherheit hättest, wäre dir dieses Ergebnis nicht nur Zeit und Energie wert — sondern grundsätzlich auch Geld. Richtig?“

„Keine Sorge — ich will keine 15.000 Euro von dir. Und ich bin auch kein Zauberer.“


TEIL 2 — Der eigentliche Werteframe

„Der Punkt ist: Eine Garantie kann dir niemand geben. Nicht wir, nicht du, nicht sie/er, niemand.“

        </div>

function renderObjections() {
  const panel = document.getElementById("objectionPanel");
  if (!panel) return;

  const objections = objectionsByPhase[currentPhase] || [];

  if (!objections.length) {
    panel.innerHTML = `<div class="empty-objections">In dieser Phase sind aktuell keine Test-Einwände hinterlegt.</div>`;
    return;
  }

  panel.innerHTML = objections.map((o, i) => `
    <div class="objection-card" id="objection-${i}" onclick="toggleObjection(${i})">

let currentPhase = 0;
let leads = [];
let currentLead = null;
let activeSetter = localStorage.getItem("lr_active_setter") || "Marvin";
let autosaveTimer = null;
let isSavingNote = false;

function safe(v) {
  return String(v || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}


function setterNameForText() {
  return activeSetter || currentLead?.setter || "[DEIN NAME]";
}

function leadNameForText() {
  const inputName = document.getElementById("leadName")?.value?.trim();
  const loadedName = currentLead?.name || "";
  return inputName || loadedName || "[NAME]";
}

function leadFirstName() {
  const name = leadNameForText();
  return name && name !== "[NAME]" ? name.split(" ")[0] : "[NAME]";
}

function personalize(text) {
  return String(text || "")
    .replaceAll("[NAME]", leadFirstName())
    .replaceAll("[DEIN NAME]", setterNameForText());
}



function leadFirstName() {
  const inputName = document.getElementById("leadName")?.value?.trim();
  const loadedName = currentLead?.name || "";
  const name = inputName || loadedName || "";
  return name ? name.split(" ")[0] : "[NAME]";
}

function personalize(text) {
  return String(text || "").replaceAll("[NAME]", leadFirstName());
}



function displayText(text) {
  const leadName =
    document.getElementById("leadName")?.value?.trim()
    || currentLead?.name
    || "[NAME]";

  const firstName = leadName !== "[NAME]" ? leadName.split(" ")[0] : "[NAME]";
  const setter = activeSetter || currentLead?.setter || "[DEIN NAME]";

  return String(text || "")
    .replaceAll("[NAME]", firstName)
    .replaceAll("[DEIN NAME]", setter);
}

function formatDate(v) {
  if (!v) return "";
  try {
    return new Date(v).toLocaleString();
  } catch(e) {
    return v;
  }
}


function renderSetterSwitch() {
  const panel = document.getElementById("setterSwitch");
  if (!panel) return;

  const setters = ["Marvin", "Oli", "Sascha"];

  panel.innerHTML = setters.map(name => `
    <button class="setter-btn ${activeSetter === name ? "active" : ""}" onclick="setActiveSetter('${name}')">
      ${name}
    </button>
  `).join("");
}

async function setActiveSetter(name) {
  activeSetter = name;
  localStorage.setItem("lr_active_setter", name);
  currentLead = null;
  localStorage.removeItem("lr_crm_current_lead");
  renderSetterSwitch();
  await loadLeads();
}

async function loadLeads() {
  const { data, error } = await supabaseClient
    .from("leads")
    .select("*")
    .eq("setter", activeSetter)
    .order("created_at", { ascending:false });

  if (error) {
    console.error(error);
    document.getElementById("sideStatus").innerText = "Fehler beim Laden.";
    return;
  }

  leads = data || [];
  document.getElementById("sideStatus").innerText = leads.length + " Leads für " + activeSetter + " geladen.";
  renderLeadList();

  const remembered = localStorage.getItem("lr_crm_current_lead");
  if (remembered && !currentLead) {
    const found = leads.find(l => l.id === remembered);
    if (found) selectLead(found.id);
  } else if (!currentLead && leads.length) {
    selectLead(leads[0].id);
  } else {
    renderMain();
  }
}


function importedInfoBlock() {
  return "";
}

function renderLeadList() {
  const q = (document.getElementById("leadSearch")?.value || "").toLowerCase();
  const list = document.getElementById("leadList");

  const filtered = leads.filter(l => {
    const hay = `${l.name || ""} ${l.setter || ""} ${l.status || ""} ${l.phone || ""}`.toLowerCase();
    return hay.includes(q);
  });

  list.innerHTML = filtered.map(l => `
    <button class="lead-btn ${currentLead?.id === l.id ? "active" : ""}" onclick="selectLead('${l.id}')">
      ${safe(l.name || "Ohne Name")}
      <small>${safe(l.status || "Setter")} · ${safe(l.setter || "kein Setter")}</small>
    </button>
  `).join("") || `<p class="muted">Keine Leads gefunden.</p>`;
}

function renderPhaseNav() {
  document.getElementById("phaseNav").innerHTML = phases.map((p,i)=>`
    <button class="phase-btn ${i===currentPhase ? "active" : ""}" onclick="goPhase(${i})">
      ${safe(p.title)}
    </button>
  `).join("");
}

async function selectLead(id) {
  const found = leads.find(l => l.id === id);
  if (!found) return;
  currentLead = found;
  localStorage.setItem("lr_crm_current_lead", id);
  renderLeadList();
  renderPhaseNav();
  renderObjections();
  await renderMain();
}

function newLead() {
  clearTimeout(autosaveTimer);
  currentLead = null;
  currentPhase = 0;
  localStorage.removeItem("lr_crm_current_lead");
  renderLeadList();
  renderPhaseNav();
  renderObjections();
  renderMain();
}

async function createOrUpdateLead() {
  const name = document.getElementById("leadName").value.trim();
  const setter = activeSetter;
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email")?.value.trim() || "";
  const job_situation = document.getElementById("jobSituation")?.value.trim() || "";
  const form_submitted_at = document.getElementById("formSubmittedAt")?.value.trim() || "";
  const status = document.getElementById("status").value;
  const appointment_at_raw = document.getElementById("appointmentAt").value;
  const appointment_at = appointment_at_raw ? new Date(appointment_at_raw).toISOString() : null;

  const relationship_duration =
    document.getElementById("relationshipDuration")?.value.trim()
    || currentLead?.relationship_duration
    || "";

  const separation_duration =
    document.getElementById("separationDuration")?.value.trim()
    || currentLead?.separation_duration
    || "";

  const current_contact_status =
    document.getElementById("currentContactStatus")?.value.trim()
    || currentLead?.current_contact_status
    || "";

  if (!name) {
    alert("Lead Name fehlt.");
    return;
  }

  if (!currentLead) {
    const { data, error } = await supabaseClient
      .from("leads")
      .insert([{
        name, setter, phone, email, job_situation, form_submitted_at, status, appointment_at, relationship_duration, separation_duration, current_contact_status,
        updated_at:new Date().toISOString()
      }])
      .select()
      .single();

    if (error) {
      console.error(error);
      alert("Fehler beim Erstellen.");
      return;
    }

    currentLead = data;
    localStorage.setItem("lr_crm_current_lead", data.id);
  } else {
    const { data, error } = await supabaseClient
      .from("leads")
      .update({
        name, setter, phone, email, job_situation, form_submitted_at, status, appointment_at, relationship_duration, separation_duration, current_contact_status,
        updated_at:new Date().toISOString()
      })
      .eq("id", currentLead.id)
      .select()
      .single();

    if (error) {
      console.error(error);
      alert("Fehler beim Aktualisieren.");
      return;
    }

    currentLead = data;
  }

  await loadLeads();
  document.getElementById("saveStatus").innerText = "Lead gespeichert.";
}

async function getCurrentNote() {
  if (!currentLead) return "";
  const { data, error } = await supabaseClient
    .from("lead_notes")
    .select("note")
    .eq("lead_id", currentLead.id)
    .eq("phase_number", currentPhase)
    .maybeSingle();

  if (error) {
    console.error(error);
    return "";
  }

  return data?.note || "";
}


async function saveCaseFieldsIfPresent() {
  if (!currentLead) return;

  const relationshipEl = document.getElementById("relationshipDuration");
  const separationEl = document.getElementById("separationDuration");
  const contactEl = document.getElementById("currentContactStatus");

  if (!relationshipEl && !separationEl && !contactEl) return;

  const relationship_duration = relationshipEl?.value.trim() || currentLead.relationship_duration || "";
  const separation_duration = separationEl?.value.trim() || currentLead.separation_duration || "";
  const current_contact_status = contactEl?.value.trim() || currentLead.current_contact_status || "";

  const { data, error } = await supabaseClient
    .from("leads")
    .update({
      relationship_duration,
      separation_duration,
      current_contact_status,
      updated_at: new Date().toISOString()
    })
    .eq("id", currentLead.id)
    .select()
    .single();

  if (!error && data) {
    currentLead = data;
    const idx = leads.findIndex(l => l.id === data.id);
    if (idx >= 0) leads[idx] = data;
  } else if (error) {
    console.error("Case fields save failed:", error);
  }
}

async function saveCurrentNote(options = {}) {
  const silent = options.silent || false;

  if (!currentLead) {
    if (!silent) alert("Bitte zuerst Lead speichern.");
    return false;
  }

  await saveCaseFieldsIfPresent();

  const noteEl = document.getElementById("phaseNote");
  if (!noteEl) return true;

  const note = noteEl.value;
  const p = phases[currentPhase];

  if (isSavingNote) return true;
  isSavingNote = true;

  const status = document.getElementById("saveStatus");
  const hint = document.getElementById("autosaveHint");

  if (hint) hint.innerText = "Speichert automatisch...";

  const { error } = await supabaseClient
    .from("lead_notes")
    .upsert([{
      lead_id:currentLead.id,
      phase_number:currentPhase,
      phase_title:p.title,
      note,
      updated_at:new Date().toISOString()
    }], {
      onConflict:"lead_id,phase_number"
    });

  isSavingNote = false;

  if (error) {
    console.error(error);
    if (!silent) alert("Fehler beim Speichern der Notiz.");
    if (hint) hint.innerText = "Auto-Save fehlgeschlagen.";
    return false;
  }

  const time = new Date().toLocaleTimeString();
  if (status) status.innerText = "Notiz gespeichert: " + time;
  if (hint) hint.innerText = "Automatisch gespeichert: " + time;

  return true;
}

function scheduleAutoSave() {
  clearTimeout(autosaveTimer);

  const hint = document.getElementById("autosaveHint");
  if (hint) hint.innerText = "Änderung erkannt...";

  autosaveTimer = setTimeout(async () => {
    await saveCurrentNote({ silent:true });
  }, 900);
}

async function saveAndNext() {
  clearTimeout(autosaveTimer);
  const ok = await saveCurrentNote();
  if (ok && currentPhase < phases.length - 1) {
    currentPhase++;
    renderPhaseNav();
    await renderMain();
  }
}

async function copyNotes() {
  if (!currentLead) {
    alert("Noch kein Lead ausgewählt.");
    return;
  }

  await saveCurrentNote();

  const { data, error } = await supabaseClient
    .from("lead_notes")
    .select("*")
    .eq("lead_id", currentLead.id)
    .order("phase_number");

  if (error) {
    console.error(error);
    alert("Notizen konnten nicht geladen werden.");
    return;
  }

  let text = "CLOSER-ÜBERGABE\n";
  text += "Lead: " + (currentLead.name || "") + "\n";
  text += "Telefon: " + (currentLead.phone || "") + "\n";
  text += "E-Mail: " + (currentLead.email || "") + "\n";
  text += "Beruf/Situation: " + (currentLead.job_situation || "") + "\n";
  text += "Formularzeitpunkt: " + (currentLead.form_submitted_at || "") + "\n";
  text += "Setter: " + (currentLead.setter || "") + "\n";
  text += "Status: " + (currentLead.status || "") + "\n";
  text += "Termin: " + formatDate(currentLead.appointment_at) + "\n";
  text += "Erstellt: " + formatDate(currentLead.created_at) + "\n\n";

  if (!data || data.length === 0) {
    text += "Keine Notizen gespeichert.";
  } else {
    data.forEach(item => {
      if (item.note && item.note.trim()) {
        text += item.phase_title + "\n";
        text += item.note.trim() + "\n\n";
      }
    });
  }

  await navigator.clipboard.writeText(text);
  alert("Closer-Übergabe kopiert.");
}

async function deleteCurrentLead() {
  if (!currentLead) return;
  const ok = confirm("Diesen Lead wirklich löschen? Alle Notizen dazu werden ebenfalls gelöscht.");
  if (!ok) return;

  const { error } = await supabaseClient
    .from("leads")
    .delete()
    .eq("id", currentLead.id);

  if (error) {
    console.error(error);
    alert("Löschen fehlgeschlagen.");
    return;
  }

  currentLead = null;
  localStorage.removeItem("lr_crm_current_lead");
  await loadLeads();
}

async function goPhase(i) {
  if (i === currentPhase) return;

  clearTimeout(autosaveTimer);

  try {
    await saveCurrentNote({ silent:true });
  } catch (e) {
    console.warn("Autosave vor Phasenwechsel übersprungen:", e);
  }

  currentPhase = i;
  renderPhaseNav();
  if (typeof renderObjections === "function") renderObjections();
  await renderMain();
}


function buildGapSummaryFromLead() {
  const name =
    document.getElementById("leadName")?.value?.trim()
    || currentLead?.name
    || "[NAME]";

  const firstName = name !== "[NAME]" ? name.split(" ")[0] : "[NAME]";

  const relationship =
    document.getElementById("relationshipDuration")?.value?.trim()
    || currentLead?.relationship_duration
    || "X";

  const separation =
    document.getElementById("separationDuration")?.value?.trim()
    || currentLead?.separation_duration
    || "X";

  const contact =
    document.getElementById("currentContactStatus")?.value?.trim()
    || currentLead?.current_contact_status
    || "X";

  return `Also ${firstName}, ihr wart nun ${relationship} zusammen, seid jetzt seit ${separation} getrennt, habt aktuell ${contact} Kontakt und du willst eigentlich einfach nur wieder glücklich mit ihm/ihr zusammen sein, wieder gemeinsam an einem Strang ziehen und dass sie/er ihre/seine inneren Blockaden abbaut — richtig?`;
}

async function showLeadOverview() {
  if (!currentLead) {
    alert("Kein Lead ausgewählt.");
    return;
  }

  const { data, error } = await supabaseClient
    .from("lead_notes")
    .select("*")
    .eq("lead_id", currentLead.id)
    .order("phase_number");

  if (error) {
    console.error(error);
    alert("Übersicht konnte nicht geladen werden.");
    return;
  }


  const transcriptHtml = transcript && transcript.trim()
    ? `<div class="card">
        <h3>Sipgate Gesprächstranskript</h3>
        <div class="script">${safe(transcript)}</div>
      </div>`
    : `<div class="card">
        <h3>Sipgate Gesprächstranskript</h3>
        <div class="script">Kein Transkript gespeichert.</div>
      </div>`;

  const notesHtml = data.map(item => `
    <div class="card">
      <h3>${safe(item.phase_title)}</h3>
      <div class="script">${safe(item.note || "Keine Notiz.")}</div>
    </div>
  `).join("");

  const popup = document.createElement("div");
  popup.id = "overviewPopup";
  popup.style.position = "fixed";
  popup.style.inset = "0";
  popup.style.background = "rgba(0,0,0,.82)";
  popup.style.zIndex = "9999";
  popup.style.overflowY = "auto";
  popup.style.padding = "40px";

  popup.innerHTML = `
    <div style="max-width:1100px;margin:auto;">
      <div class="card">
        <div class="flex" style="justify-content:space-between;">
          <div>
            <h2>${safe(currentLead.name || "Lead")}</h2>
            <div class="muted">
              ${safe(currentLead.status || "")} ·
              ${safe(currentLead.setter || "")}
            </div>
          </div>

          <button class="danger-btn" onclick="document.getElementById('overviewPopup').remove()">
            Schließen
          </button>
        </div>
      </div>

      ${transcriptHtml}
      ${notesHtml || '<div class="card">Keine Notizen vorhanden.</div>'}
    </div>
  `;

  document.body.appendChild(popup);
}



async function loadTranscript() {
  if (!currentLead) return "";

  const { data, error } = await supabaseClient
    .from("lead_transcripts")
    .select("*")
    .eq("lead_id", currentLead.id)
    .order("updated_at", { ascending:false })
    .limit(1)
    .maybeSingle();

  if (error) {
    console.error(error);
    return "";
  }

  return data?.transcript_text || "";
}

async function saveTranscript() {
  if (!currentLead) {
    alert("Bitte zuerst Lead speichern.");
    return;
  }

  const text = document.getElementById("transcriptText")?.value || "";

  const { data: existing } = await supabaseClient
    .from("lead_transcripts")
    .select("id")
    .eq("lead_id", currentLead.id)
    .limit(1)
    .maybeSingle();

  let error;

  if (existing?.id) {
    const result = await supabaseClient
      .from("lead_transcripts")
      .update({
        transcript_text: text,
        source: "sipgate",
        updated_at: new Date().toISOString()
      })
      .eq("id", existing.id);

    error = result.error;
  } else {
    const result = await supabaseClient
      .from("lead_transcripts")
      .insert([{
        lead_id: currentLead.id,
        transcript_text: text,
        source: "sipgate",
        updated_at: new Date().toISOString()
      }]);

    error = result.error;
  }

  if (error) {
    console.error(error);
    alert("Transkript konnte nicht gespeichert werden.");
    return;
  }

  document.getElementById("saveStatus").innerText = "Transkript gespeichert: " + new Date().toLocaleTimeString();
}

function handleTranscriptFile(input) {
  const file = input.files?.[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    const text = e.target.result || "";
    document.getElementById("transcriptText").value = text;
  };

  reader.readAsText(file, "UTF-8");
}

async function copyTranscript() {
  if (!currentLead) {
    alert("Kein Lead ausgewählt.");
    return;
  }

  const text = document.getElementById("transcriptText")?.value || await loadTranscript();

  if (!text.trim()) {
    alert("Kein Transkript vorhanden.");
    return;
  }

  await navigator.clipboard.writeText(text);
  alert("Transkript kopiert.");
}


async function showTranscriptPopup() {
  if (!currentLead) {
    alert("Bitte zuerst Lead auswählen oder speichern.");
    return;
  }

  const transcript = await loadTranscript();

  const popup = document.createElement("div");
  popup.id = "transcriptPopup";
  popup.style.position = "fixed";
  popup.style.inset = "0";
  popup.style.background = "rgba(0,0,0,.82)";
  popup.style.zIndex = "9999";
  popup.style.overflowY = "auto";
  popup.style.padding = "40px";

  popup.innerHTML = `
    <div style="max-width:1000px;margin:auto;">
      <div class="card">
        <div class="flex" style="justify-content:space-between;">
          <div>
            <h2>Sipgate Gesprächstranskript</h2>
            <div class="muted">${safe(currentLead.name || "Lead")}</div>
          </div>
          <button class="danger-btn" onclick="document.getElementById('transcriptPopup').remove()">Schließen</button>
        </div>
      </div>

      <div class="card">
        <p class="muted">Transkript hier einfügen oder als .txt hochladen. Es wird pro Lead in Supabase gespeichert.</p>

        <div class="flex" style="margin-bottom:14px;">
          <input type="file" accept=".txt,.text" onchange="handleTranscriptFile(this)" style="max-width:340px;">
          <button class="main-btn" onclick="saveTranscript()">Transkript speichern</button>
          <button class="secondary-btn" onclick="copyTranscript()">Transkript kopieren</button>
        </div>

        <textarea id="transcriptText" placeholder="Sipgate-Transkript hier einfügen...">${safe(transcript)}</textarea>
      </div>
    </div>
  `;

  document.body.appendChild(popup);
}







function normalizePhoneForWhatsApp(phone) {
  let digits = String(phone || "").replace(/\D/g, "");
  if (!digits) return "";
  if (digits.startsWith("00")) digits = digits.slice(2);
  if (digits.startsWith("0")) digits = "49" + digits.slice(1);
  return digits;
}

function buildFirstContactMessage() {
  const name = leadFirstName();
  const setter = setterNameForText();

  return `Hey ${name}, ${setter} hier aus dem Love Repair Team von Florian.

Du hattest dich ja für einen Platz in Florians persönlicher Ex-Zurück-Begleitung beworben.

Bei uns ist die Vorgehensweise so, dass wir deine/n Ex von selbst dazu bringen, sich einen Neuanfang mit dir zu wünschen — ohne dass du hinterherrennen oder dich verbiegen musst.

Hast du gerade kurz ein paar Minuten Zeit? Dann würde ich dir ein paar Fragen stellen, um herauszufinden, ob wir dir in deiner Situation weiterhelfen können.`;
}

function openWhatsAppFirstContact() {
  const phoneInput = document.getElementById("phone")?.value?.trim();
  const phone = phoneInput || currentLead?.phone || "";
  const normalizedPhone = normalizePhoneForWhatsApp(phone);

  if (!normalizedPhone) {
    alert("Telefonnummer fehlt.");
    return;
  }

  const message = buildFirstContactMessage();
  const url = `https://wa.me/${normalizedPhone}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");
}







async function importSheetAndSaveLead() {
  const input = document.getElementById("sheetQuickImport");
  const raw = input?.value || "";
  const cols = raw.split("\t");

  if (cols.length < 5) {
    alert("Die Zeile wurde nicht erkannt. Bitte direkt aus Google Sheets eine komplette Zeile kopieren.");
    return;
  }

  const formSubmittedAt = (cols[0] || "").trim();
  const name = (cols[1] || "").trim();
  const email = (cols[3] || "").trim();
  const phone = (cols[4] || "").trim();
  const jobSituation = (cols[5] || "").trim();

  const setVal = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.value = val || "";
  };

  setVal("leadName", name);
  setVal("phone", phone);
  setVal("email", email);
  setVal("jobSituation", jobSituation);
  setVal("formSubmittedAt", formSubmittedAt);

  if (input) input.value = "";

  await createOrUpdateLead();

  const status = document.getElementById("saveStatus");
  if (status) status.innerText = "Datensatz importiert und Lead gespeichert.";
}


function normalizePhoneForTelLink(phone) {
  let raw = String(phone || "").trim();

  if (!raw) return "";

  // Keep + when already international, otherwise remove non-digits.
  if (raw.startsWith("+")) {
    return "+" + raw.slice(1).replace(/\D/g, "");
  }

  let digits = raw.replace(/\D/g, "");

  if (digits.startsWith("00")) {
    return "+" + digits.slice(2);
  }

  if (digits.startsWith("0")) {
    return "+49" + digits.slice(1);
  }

  if (digits.startsWith("49")) {
    return "+" + digits;
  }

  return "+" + digits;
}

function startSipgateCall() {
  const phone =
    document.getElementById("phone")?.value?.trim()
    || currentLead?.phone
    || "";

  const normalized = normalizePhoneForTelLink(phone);

  if (!normalized || normalized.length < 6) {
    alert("Telefonnummer fehlt oder ist ungültig.");
    return;
  }

  window.location.href = "tel:" + normalized;
}


renderPhaseNav();
renderObjections();
renderGlobalTools();
renderSetterSwitch();
loadLeads();
